<h1 id="1-a-fun%C3%A7%C3%A3o-quadr%C3%A1tica-forma-geral">1. A Função Quadrática: Forma Geral</h1>
<div class="content-wrapper">
<div class="theory" style="font-size: 21px;">
<p>A <strong>função quadrática</strong> (ou de 2º grau) é definida por um polinômio de grau 2. Seu gráfico é sempre uma parábola e ela é a ferramenta perfeita para modelar áreas, trajetórias e otimizações.</p>

<h1 id="6-problemas-de-modelagem-otimiza%C3%A7%C3%A3o">6. Problemas de Modelagem (Otimização)</h1>
<div class="content-wrapper">
<div class="theory" style="font-size: 21px;">
