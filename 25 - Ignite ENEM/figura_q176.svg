<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -18 395 280" width="790" height="560">
  <rect x="-55" y="-18" width="395" height="280" fill="#FFFFFF" rx="6"/>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#231F20"/>
    </marker>
  </defs>
  <!-- Malha tracejada (horizontal e vertical) -->
  <g stroke="#939598" stroke-width="1" stroke-dasharray="4,4">
    <line x1="0" y1="180" x2="300" y2="180"/>
    <line x1="0" y1="150" x2="300" y2="150"/>
    <line x1="0" y1="120" x2="300" y2="120"/>
    <line x1="0" y1="90" x2="300" y2="90"/>
    <line x1="0" y1="60" x2="300" y2="60"/>
    <line x1="0" y1="30" x2="300" y2="30"/>
    <line x1="0" y1="0" x2="300" y2="0"/>
    <line x1="34" y1="210" x2="34" y2="-10"/>
    <line x1="68" y1="210" x2="68" y2="-10"/>
    <line x1="102" y1="210" x2="102" y2="-10"/>
    <line x1="136" y1="210" x2="136" y2="-10"/>
    <line x1="170" y1="210" x2="170" y2="-10"/>
    <line x1="204" y1="210" x2="204" y2="-10"/>
    <line x1="238" y1="210" x2="238" y2="-10"/>
    <line x1="272" y1="210" x2="272" y2="-10"/>
  </g>
  <!-- Reta de tendência: passa exatamente por (2014, 4), (2017, 5) e (2020, 6) -->
  <line x1="0" y1="100" x2="301" y2="11.5" stroke="#DD5151" stroke-width="2.4"/>
  <!-- Pontos registrados no período de 2014 a 2021 -->
  <g fill="#DD5151">
    <circle cx="34" cy="106.5" r="3.6"/>
    <circle cx="68" cy="60" r="3.6"/>
    <circle cx="102" cy="63.9" r="3.6"/>
    <circle cx="136" cy="73.2" r="3.6"/>
    <circle cx="170" cy="42.3" r="3.6"/>
    <circle cx="204" cy="30" r="3.6"/>
    <circle cx="238" cy="54.9" r="3.6"/>
    <circle cx="272" cy="8.7" r="3.6"/>
  </g>
  <!-- Eixos coordenados -->
  <line x1="0" y1="210" x2="304" y2="210" stroke="#231F20" stroke-width="1.8" marker-end="url(#tri)"/>
  <line x1="0" y1="210" x2="0" y2="-10" stroke="#231F20" stroke-width="1.8" marker-end="url(#tri)"/>
  <!-- Rótulos numéricos do eixo vertical (Receita) -->
  <g font-family="Arial, sans-serif" font-size="11" fill="#231F20" text-anchor="end">
    <text x="-6" y="214">0</text>
    <text x="-6" y="184">1</text>
    <text x="-6" y="154">2</text>
    <text x="-6" y="124">3</text>
    <text x="-6" y="94">4</text>
    <text x="-6" y="64">5</text>
    <text x="-6" y="34">6</text>
    <text x="-6" y="4">7</text>
  </g>
  <!-- Rótulos numéricos do eixo horizontal (Ano) -->
  <g font-family="Arial, sans-serif" font-size="10.5" fill="#231F20" text-anchor="middle">
    <text x="34" y="225">2014</text>
    <text x="68" y="225">2015</text>
    <text x="102" y="225">2016</text>
    <text x="136" y="225">2017</text>
    <text x="170" y="225">2018</text>
    <text x="204" y="225">2019</text>
    <text x="238" y="225">2020</text>
    <text x="272" y="225">2021</text>
  </g>
  <!-- Títulos dos eixos -->
  <text x="-30" y="105" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#231F20" text-anchor="middle" transform="rotate(-90, -30, 105)">Receita anual (em milhão de reais)</text>
  <text x="150" y="246" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#231F20" text-anchor="middle">Ano</text>
</svg>

