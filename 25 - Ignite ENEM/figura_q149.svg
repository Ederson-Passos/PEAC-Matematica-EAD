<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -30 515 200" width="1030" height="400">
  <rect x="-40" y="-30" width="515" height="200" fill="#FFFFFF" rx="6"/>
  <!-- Borda da tela do instrumento -->
  <rect x="-30" y="-22" width="480" height="180" fill="none" stroke="#111111" stroke-width="2"/>
  <!-- Malha quadriculada 14x4 (escala 30px = 1 cm) -->
  <g stroke="#C8C8C8" stroke-width="1">
    <line x1="0" y1="0" x2="420" y2="0"/>
    <line x1="0" y1="30" x2="420" y2="30"/>
    <line x1="0" y1="60" x2="420" y2="60"/>
    <line x1="0" y1="90" x2="420" y2="90"/>
    <line x1="0" y1="120" x2="420" y2="120"/>
    <line x1="0" y1="0" x2="0" y2="120"/>
    <line x1="30" y1="0" x2="30" y2="120"/>
    <line x1="60" y1="0" x2="60" y2="120"/>
    <line x1="90" y1="0" x2="90" y2="120"/>
    <line x1="120" y1="0" x2="120" y2="120"/>
    <line x1="150" y1="0" x2="150" y2="120"/>
    <line x1="180" y1="0" x2="180" y2="120"/>
    <line x1="210" y1="0" x2="210" y2="120"/>
    <line x1="240" y1="0" x2="240" y2="120"/>
    <line x1="270" y1="0" x2="270" y2="120"/>
    <line x1="300" y1="0" x2="300" y2="120"/>
    <line x1="330" y1="0" x2="330" y2="120"/>
    <line x1="360" y1="0" x2="360" y2="120"/>
    <line x1="390" y1="0" x2="390" y2="120"/>
    <line x1="420" y1="0" x2="420" y2="120"/>
  </g>
  <!-- Eixos coordenados com setas -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111111"/>
    </marker>
  </defs>
  <line x1="0" y1="120" x2="438" y2="120" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="0" y1="120" x2="0" y2="-16" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="392" y="138" font-family="Arial, sans-serif" font-size="12" fill="#111111">Distância</text>
  <text x="6" y="-5" font-family="Arial, sans-serif" font-size="12" fill="#111111">Altitude</text>
  <!-- Origem e Destino -->
  <circle cx="0" cy="120" r="4" fill="#111111"/>
  <text x="0" y="135" font-family="Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle">Origem</text>
  <text x="0" y="147" font-family="Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle">do voo</text>
  <circle cx="390" cy="120" r="4" fill="#111111"/>
  <text x="354" y="136" font-family="Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle">Destino</text>
  <!-- Trajetória exata: (0,0) -> (2,1) -> (7,1) -> (10,0.3) -> (11,0.4) -> (13,0) -->
  <polyline points="0,120 60,90 210,90 300,111 330,108 390,120" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
</svg>

