<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 220" width="1300" height="440">
  <rect x="0" y="0" width="650" height="220" fill="#FFFFFF" rx="8"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#231F20"/>
    </marker>
    <clipPath id="boiaClip">
      <circle cx="116" cy="38" r="9.2"/>
    </clipPath>
  </defs>

  <!-- CAIXA 1 (ESQUERDA): Caixa enchendo (boia abaixada) -->
  <g transform="translate(65, 10)">
    <!-- Fundo da caixa -->
    <polygon points="0,162 200,162 200,20 186,2 14,2 0,20" fill="#E6E7E8"/>
    <!-- Água frente e topo -->
    <polygon points="0,162 200,162 200,137 0,137" fill="#55B3DF"/>
    <polygon points="0,137 200,137 186,105 14,105" fill="#A4D4EC"/>
    <!-- Ralo -->
    <ellipse cx="100" cy="145" rx="16" ry="5.6" fill="#6C77B2" stroke="#3B4269" stroke-width="1.2"/>
    <!-- Ondulações e jato de água -->
    <ellipse cx="179" cy="121" rx="9.6" ry="3.2" fill="none" stroke="#2B9FD9" stroke-width="1"/>
    <ellipse cx="179" cy="121" rx="5.2" ry="1.8" fill="none" stroke="#2B9FD9" stroke-width="1"/>
    <line x1="179" y1="38" x2="179" y2="121" stroke="#2B9FD9" stroke-width="2.6" stroke-linecap="round"/>
    <!-- Mecanismo da boia abaixada -->
    <line x1="178" y1="38" x2="194" y2="38" stroke="#231F20" stroke-width="3.2"/>
    <line x1="178" y1="38" x2="166" y2="92" stroke="#231F20" stroke-width="1.5"/>
    <circle cx="166" cy="92" r="8.8" fill="#231F20"/>
    <!-- Arestas internas tracejadas -->
    <g stroke="#231F20" stroke-width="1.2" stroke-dasharray="4,3" fill="none">
      <line x1="0" y1="162" x2="14" y2="128"/>
      <line x1="200" y1="162" x2="186" y2="128"/>
      <line x1="14" y1="128" x2="186" y2="128"/>
      <line x1="14" y1="128" x2="14" y2="20"/>
      <line x1="186" y1="128" x2="186" y2="20"/>
    </g>
    <!-- Arestas externas sólidas -->
    <g stroke="#231F20" stroke-width="1.5" fill="none" stroke-linejoin="round">
      <rect x="0" y="20" width="200" height="142"/>
      <polyline points="0,20 14,2 186,2 200,20"/>
      <line x1="14" y1="20" x2="14" y2="2"/>
      <line x1="186" y1="20" x2="186" y2="2"/>
    </g>
    <!-- Cotas da base: 1,5 dm e 2,5 dm -->
    <line x1="0" y1="162" x2="-44" y2="162" stroke="#231F20" stroke-width="0.9" stroke-dasharray="3,2"/>
    <line x1="0" y1="128" x2="-30" y2="128" stroke="#231F20" stroke-width="0.9" stroke-dasharray="3,2"/>
    <line x1="-41" y1="160" x2="-28" y2="130" stroke="#231F20" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="-38" y="148" font-family="Arial, sans-serif" font-size="11.5" fill="#231F20" text-anchor="end">1,5 dm</text>

    <line x1="0" y1="162" x2="-6" y2="184" stroke="#231F20" stroke-width="0.9" stroke-dasharray="3,2"/>
    <line x1="200" y1="162" x2="206" y2="184" stroke="#231F20" stroke-width="0.9" stroke-dasharray="3,2"/>
    <line x1="-4" y1="182" x2="204" y2="182" stroke="#231F20" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <rect x="76" y="174" width="48" height="15" fill="#FFFFFF"/>
    <text x="100" y="186" font-family="Arial, sans-serif" font-size="11.5" fill="#231F20" text-anchor="middle">2,5 dm</text>
  </g>

  <!-- CAIXA 2 (DIREITA): Abastecimento interrompido (altura 2 dm) -->
  <g transform="translate(365, 10)">
    <!-- Fundo da caixa -->
    <polygon points="0,162 200,162 200,20 186,2 14,2 0,20" fill="#E6E7E8"/>
    <!-- Água frente e topo -->
    <polygon points="0,162 200,162 200,46 0,46" fill="#55B3DF"/>
    <polygon points="0,46 200,46 186,24 14,24" fill="#A4D4EC"/>
    <!-- Ralo -->
    <ellipse cx="100" cy="145" rx="16" ry="5.6" fill="#6C77B2" stroke="#3B4269" stroke-width="1.2"/>
    <!-- Mecanismo da boia levantada na horizontal -->
    <line x1="178" y1="38" x2="194" y2="38" stroke="#231F20" stroke-width="3.2"/>
    <line x1="178" y1="38" x2="116" y2="38" stroke="#231F20" stroke-width="1.5"/>
    <!-- Esfera da boia (metade submersa e metade fora d'água) -->
    <g clip-path="url(#boiaClip)">
      <rect x="104" y="26" width="24" height="14" fill="#231F20"/>
      <rect x="104" y="40" width="24" height="12" fill="#5C6BA8"/>
      <ellipse cx="116" cy="40" rx="9.2" ry="1.8" fill="none" stroke="#85A8D0" stroke-width="1"/>
    </g>
    <!-- Arestas internas tracejadas -->
    <g stroke="#231F20" stroke-width="1.2" stroke-dasharray="4,3" fill="none">
      <line x1="0" y1="162" x2="14" y2="128"/>
      <line x1="200" y1="162" x2="186" y2="128"/>
      <line x1="14" y1="128" x2="186" y2="128"/>
      <line x1="14" y1="128" x2="14" y2="20"/>
      <line x1="186" y1="128" x2="186" y2="20"/>
    </g>
    <!-- Arestas externas sólidas -->
    <g stroke="#231F20" stroke-width="1.5" fill="none" stroke-linejoin="round">
      <rect x="0" y="20" width="200" height="142"/>
      <polyline points="0,20 14,2 186,2 200,20"/>
      <line x1="14" y1="20" x2="14" y2="2"/>
      <line x1="186" y1="20" x2="186" y2="2"/>
    </g>
    <!-- Cotas da base: 1,5 dm e 2,5 dm -->
    <line x1="0" y1="162" x2="-44" y2="162" stroke="#231F20" stroke-width="0.9" stroke-dasharray="3,2"/>
    <line x1="0" y1="128" x2="-30" y2="128" stroke="#231F20" stroke-width="0.9" stroke-dasharray="3,2"/>
    <line x1="-41" y1="160" x2="-28" y2="130" stroke="#231F20" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="-38" y="148" font-family="Arial, sans-serif" font-size="11.5" fill="#231F20" text-anchor="end">1,5 dm</text>

    <line x1="0" y1="162" x2="-6" y2="184" stroke="#231F20" stroke-width="0.9" stroke-dasharray="3,2"/>
    <line x1="200" y1="162" x2="206" y2="184" stroke="#231F20" stroke-width="0.9" stroke-dasharray="3,2"/>
    <line x1="-4" y1="182" x2="204" y2="182" stroke="#231F20" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <rect x="76" y="174" width="48" height="15" fill="#FFFFFF"/>
    <text x="100" y="186" font-family="Arial, sans-serif" font-size="11.5" fill="#231F20" text-anchor="middle">2,5 dm</text>

    <!-- Cota de 2 dm (altura da coluna de água à direita) -->
    <line x1="200" y1="162" x2="242" y2="162" stroke="#231F20" stroke-width="0.9" stroke-dasharray="3,2"/>
    <line x1="200" y1="46" x2="242" y2="46" stroke="#231F20" stroke-width="0.9" stroke-dasharray="3,2"/>
    <line x1="236" y1="160" x2="236" y2="48" stroke="#231F20" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <rect x="218" y="96" width="36" height="16" fill="#FFFFFF"/>
    <text x="236" y="108" font-family="Arial, sans-serif" font-size="11.5" fill="#231F20" text-anchor="middle">2 dm</text>
  </g>
</svg>

