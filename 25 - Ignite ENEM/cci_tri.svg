<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" width="1200" height="740">
  <defs>
    <linearGradient id="bgCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E0407"/>
      <stop offset="100%" stop-color="#2E080D"/>
    </linearGradient>
    <marker id="arrowAxis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E0E0E0"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FFD54F"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#80DEEA"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A5D6A7"/>
    </marker>
  </defs>

  <!-- Fundo escuro elegante integrado ao tema Ignite -->
  <rect x="2" y="2" width="596" height="366" rx="12" fill="url(#bgCard)" stroke="rgba(255,213,79,0.35)" stroke-width="1.5"/>

  <!-- Título do Gráfico -->
  <text x="300" y="28" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFD54F" text-anchor="middle">Curva Característica do Item (CCI) — Modelo de 3 Parâmetros</text>

  <!-- Grade de fundo sutil -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <line x1="75" y1="60" x2="555" y2="60"/>
    <line x1="75" y1="115" x2="555" y2="115"/>
    <line x1="75" y1="170" x2="555" y2="170"/>
    <line x1="75" y1="225" x2="555" y2="225"/>
    <line x1="170" y1="55" x2="170" y2="280"/>
    <line x1="315" y1="55" x2="315" y2="280"/>
    <line x1="460" y1="55" x2="460" y2="280"/>
  </g>

  <!-- Assíntota superior P = 1,0 -->
  <line x1="75" y1="60" x2="545" y2="60" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" stroke-dasharray="4,4"/>
  <text x="66" y="64" font-family="Arial, sans-serif" font-size="12" fill="#CCCCCC" text-anchor="end">1,0</text>

  <!-- Parâmetro C: Assíntota inferior (Acerto casual, ex: c = 0,20 -> y = 236) -->
  <line x1="75" y1="236" x2="545" y2="236" stroke="#A5D6A7" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="66" y="240" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#A5D6A7" text-anchor="end">C</text>

  <!-- Ponto de Inflexão: theta = B (x = 315), P(B) = (1+C)/2 (y = 148) -->
  <!-- Linha horizontal e vertical do Parâmetro B -->
  <line x1="75" y1="148" x2="315" y2="148" stroke="#80DEEA" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="315" y1="148" x2="315" y2="280" stroke="#80DEEA" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="66" y="152" font-family="Arial, sans-serif" font-size="11" fill="#80DEEA" text-anchor="end">(1+C)/2</text>

  <!-- Curva Logística em S: de (80, 234) passando por (315, 148) até (545, 62) -->
  <path d="M 80 234 C 195 233, 245 215, 315 148 C 385 81, 435 63, 545 62" fill="none" stroke="#FF5252" stroke-width="4" stroke-linecap="round"/>

  <!-- Reta Tangente no Ponto de Inflexão (Parâmetro A - Discriminação / Inclinação) -->
  <line x1="250" y1="210" x2="380" y2="86" stroke="#FFD54F" stroke-width="2.5" stroke-dasharray="3,3"/>
  <!-- Arco indicando a inclinação A -->
  <path d="M 345 148 A 30 30 0 0 0 336 127" fill="none" stroke="#FFD54F" stroke-width="2"/>
  <line x1="315" y1="148" x2="352" y2="148" stroke="#FFD54F" stroke-width="1.2"/>

  <!-- Ponto de inflexão destacado -->
  <circle cx="315" cy="148" r="6" fill="#FFD54F" stroke="#1E0407" stroke-width="2"/>

  <!-- Eixos Coordenados -->
  <line x1="75" y1="280" x2="565" y2="280" stroke="#E0E0E0" stroke-width="2" marker-end="url(#arrowAxis)"/>
  <line x1="75" y1="280" x2="75" y2="42" stroke="#E0E0E0" stroke-width="2" marker-end="url(#arrowAxis)"/>
  <text x="66" y="284" font-family="Arial, sans-serif" font-size="12" fill="#CCCCCC" text-anchor="end">0,0</text>

  <!-- Rótulos dos Eixos -->
  <text x="320" y="312" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Proficiência do Participante (θ)</text>
  <text x="24" y="165" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90, 24, 165)">Probabilidade de Acerto P(θ)</text>

  <!-- Caixas de Anotação dos 3 Parâmetros no Gráfico -->
  <!-- A: Discriminação -->
  <rect x="135" y="72" width="150" height="42" rx="6" fill="rgba(255,213,79,0.14)" stroke="#FFD54F" stroke-width="1.2"/>
  <text x="210" y="90" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#FFD54F" text-anchor="middle">A — Discriminação</text>
  <text x="210" y="106" font-family="Arial, sans-serif" font-size="10.5" fill="#FFF8E1" text-anchor="middle">Inclinação na inflexão</text>
  <line x1="285" y1="100" x2="332" y2="128" stroke="#FFD54F" stroke-width="1.5" marker-end="url(#arrowGold)"/>

  <!-- B: Dificuldade -->
  <rect x="292" y="284" width="46" height="20" rx="4" fill="#80DEEA"/>
  <text x="315" y="299" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111" text-anchor="middle">B</text>
  <rect x="345" y="185" width="165" height="42" rx="6" fill="rgba(128,222,234,0.14)" stroke="#80DEEA" stroke-width="1.2"/>
  <text x="427" y="203" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#80DEEA" text-anchor="middle">B — Dificuldade</text>
  <text x="427" y="219" font-family="Arial, sans-serif" font-size="10.5" fill="#E0F7FA" text-anchor="middle">Posição de θ na inflexão</text>
  <line x1="345" y1="206" x2="320" y2="206" stroke="#80DEEA" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

  <!-- C: Acerto Casual -->
  <rect x="92" y="184" width="145" height="38" rx="6" fill="rgba(165,214,167,0.14)" stroke="#A5D6A7" stroke-width="1.2"/>
  <text x="164" y="201" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#A5D6A7" text-anchor="middle">C — Acerto Casual</text>
  <text x="164" y="215" font-family="Arial, sans-serif" font-size="10.5" fill="#E8F5E9" text-anchor="middle">Assíntota inferior (acaso)</text>
  <line x1="164" y1="222" x2="164" y2="233" stroke="#A5D6A7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Legenda compacta no rodapé do SVG -->
  <rect x="30" y="325" width="540" height="32" rx="6" fill="rgba(0,0,0,0.35)"/>
  <circle cx="52" cy="341" r="5" fill="#FFD54F"/>
  <text x="63" y="345" font-family="Arial, sans-serif" font-size="11" fill="#F5F5F5"><tspan font-weight="bold" fill="#FFD54F">A:</tspan> Poder de diferenciar θ</text>
  <circle cx="225" cy="341" r="5" fill="#80DEEA"/>
  <text x="236" y="345" font-family="Arial, sans-serif" font-size="11" fill="#F5F5F5"><tspan font-weight="bold" fill="#80DEEA">B:</tspan> Proficiência exigida pelo item</text>
  <circle cx="425" cy="341" r="5" fill="#A5D6A7"/>
  <text x="436" y="345" font-family="Arial, sans-serif" font-size="11" fill="#F5F5F5"><tspan font-weight="bold" fill="#A5D6A7">C:</tspan> Chance de chute</text>
</svg>

